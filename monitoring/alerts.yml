groups:
  - name: kk-payments-alerts
    rules:
      - alert: KkPaymentsHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{service="kk-payments", status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{service="kk-payments"}[2m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
          environment: staging
        annotations:
          summary: "kk-payments high error rate detected"
          description: "kk-payments error rate in kijani-staging has exceeded 5% for more than 2 minutes."
