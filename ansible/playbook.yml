---
- name: Configure Kijani Staging Environment
  hosts: localhost
  connection: local
  tasks:
    - name: Create staging ConfigMap manifest
      ansible.builtin.copy:
        dest: /tmp/kk-payments-configmap.yaml
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kk-payments-config
            namespace: kijani-staging
          data:
            DB_HOST: "staging-db.kijani.internal"
            ENVIRONMENT: "staging"

    - name: Apply ConfigMap to staging namespace
      ansible.builtin.command: kubectl apply -f /tmp/kk-payments-configmap.yaml
      register: kubectl_result
      changed_when: "'configured' in kubectl_result.stdout or 'created' in kubectl_result.stdout"
